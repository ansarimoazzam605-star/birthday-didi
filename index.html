<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Didi 🎂</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    background:
        radial-gradient(circle at center, #20285c 0%, #090b22 45%, #02030d 100%);
    font-family: Arial, sans-serif;
    color: white;
}

/* ================= STARS ================= */

.star {
    position: fixed;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from {
        opacity: 0.2;
        transform: scale(0.7);
    }

    to {
        opacity: 1;
        transform: scale(1.4);
    }
}

/* ================= MAIN CONTAINER ================= */

.container {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 5;
}

/* ================= CAKE ================= */

.cake {
    position: relative;
    width: 240px;
    height: 160px;
    margin-top: 50px;
    transition: 1s;
}

.layer {
    position: absolute;
    left: 10px;
    width: 220px;
    height: 65px;
    border-radius: 15px;
    background: linear-gradient(
        to bottom,
        #ff9bc5,
        #ed4f91
    );

    box-shadow:
        0 8px 0 #b82e68,
        0 12px 25px rgba(0,0,0,0.4);
}

.layer.top {
    top: 45px;
}

.layer.bottom {
    top: 95px;
}

/* Cake cream */

.cream {
    position: absolute;
    top: 35px;
    left: 10px;
    width: 220px;
    height: 35px;

    background: #fff5fa;

    border-radius: 50%;

    z-index: 2;

    box-shadow:
        0 3px 5px rgba(0,0,0,0.2);
}

.cream::before {
    content: "♥   ♥   ♥";

    position: absolute;

    left: 52px;
    top: 7px;

    color: #ff4f91;

    font-size: 16px;
}

/* ================= CANDLES ================= */

.candle {
    position: absolute;

    width: 15px;
    height: 50px;

    top: -12px;

    background:
        repeating-linear-gradient(
            45deg,
            white,
            white 7px,
            #ff5b91 7px,
            #ff5b91 14px
        );

    border-radius: 4px;

    z-index: 5;
}

.candle.one {
    left: 65px;
}

.candle.two {
    left: 113px;
}

.candle.three {
    left: 161px;
}

/* Flames */

.flame {
    position: absolute;

    width: 18px;
    height: 26px;

    left: -2px;
    top: -27px;

    background:
        radial-gradient(
            ellipse at center,
            #fff 0%,
            #ffe45b 30%,
            #ff9d00 65%,
            #ff5a00 100%
        );

    border-radius: 50% 50% 50% 50%;

    box-shadow:
        0 0 12px #ffd43b,
        0 0 25px #ff9d00;

    animation:
        flicker 0.2s infinite alternate;
}

@keyframes flicker {

    from {
        transform: scale(1) rotate(-3deg);
    }

    to {
        transform: scale(1.18) rotate(3deg);
    }

}

/* ================= BUTTON ================= */

button {

    margin-top: 45px;

    padding:
        15px 30px;

    border: none;

    border-radius: 35px;

    background:
        linear-gradient(
            45deg,
            #ff4f91,
            #9b5cff
        );

    color: white;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 0 20px rgba(255,79,145,0.5);

    transition: 0.3s;

}

button:hover {

    transform: scale(1.08);

    box-shadow:
        0 0 35px rgba(255,79,145,0.8);

}

/* ================= BIRTHDAY TEXT ================= */

.birthday {

    position: absolute;

    top: 15%;

    width: 100%;

    text-align: center;

    font-size:
        clamp(42px, 9vw, 100px);

    font-weight: 900;

    letter-spacing: 5px;

    color: white;

    opacity: 0;

    transform:
        scale(0.2)
        rotate(-5deg);

    text-shadow:

        0 0 10px #ff4f91,

        0 0 25px #ff4f91,

        0 0 50px #9b5cff,

        0 0 90px #9b5cff;

    transition:
        all 1.5s cubic-bezier(.17,.67,.32,1.4);

    z-index: 20;

}

.birthday.show {

    opacity: 1;

    transform:
        scale(1)
        rotate(0deg);

    animation:
        birthdayGlow 2s infinite alternate;

}

@keyframes birthdayGlow {

    from {
        filter: brightness(1);
    }

    to {
        filter: brightness(1.5);
    }

}

/* ================= MESSAGE ================= */

.message {

    position: absolute;

    bottom: 7%;

    width: 100%;

    text-align: center;

    padding: 0 20px;

    font-size: 20px;

    line-height: 1.6;

    opacity: 0;

    transform:
        translateY(20px);

    transition:
        2s ease;

    z-index: 20;

    text-shadow:
        0 0 10px rgba(255,255,255,0.5);

}

.message.show {

    opacity: 1;

    transform:
        translateY(0);

}

/* ================= FIREWORK PARTICLES ================= */

.particle {

    position: fixed;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    pointer-events: none;

    z-index: 15;

    animation:
        explode 1.5s ease-out forwards;

}

@keyframes explode {

    from {

        transform:
            translate(0,0)
            scale(1);

        opacity: 1;

    }

    to {

        transform:
            translate(var(--x),var(--y))
            scale(0);

        opacity: 0;

    }

}

/* ================= CAKE FADE ================= */

.hideCake {

    opacity: 0.15;

    transform:
        scale(0.9);

}

/* ================= MOBILE ================= */

@media (max-width: 600px) {

    .cake {

        transform:
            scale(0.85);

    }

    button {

        font-size: 16px;

        padding:
            13px 25px;

    }

    .message {

        font-size: 16px;

    }

}

</style>

</head>


<body>


<!-- ================= MUSIC ================= -->

<audio
    id="birthdayMusic"
    src="birthday.mp3"
    preload="auto">
</audio>


<!-- ================= BIG BIRTHDAY TEXT ================= -->

<div
    class="birthday"
    id="birthday">

    🎉 HAPPY BIRTHDAY 🎉

</div>


<!-- ================= MAIN ================= -->

<div class="container">


    <!-- CAKE -->

    <div
        class="cake"
        id="cake">


        <!-- Candles -->

        <div class="candle one">

            <div class="flame"></div>

        </div>


        <div class="candle two">

            <div class="flame"></div>

        </div>


        <div class="candle three">

            <div class="flame"></div>

        </div>


        <!-- Cream -->

        <div class="cream"></div>


        <!-- Cake layers -->

        <div class="layer top"></div>

        <div class="layer bottom"></div>


    </div>


    <!-- Button -->

    <button
        onclick="startBirthday()">

        ✨ Make a Wish ✨

    </button>


</div>


<!-- ================= MESSAGE ================= -->

<div
    class="message"
    id="message">

    💖 Happy Birthday to my amazing elder sister! 💖
    <br>

    May your life always be filled with
    happiness, success, love and beautiful memories. 🎂✨

</div>


<script>


/* ==================================================
   CREATE BACKGROUND STARS
================================================== */

for (
    let i = 0;
    i < 100;
    i++
) {

    const star =
        document.createElement("div");

    star.className =
        "star";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    star.style.animationDelay =
        Math.random() * 2 + "s";

    document.body.appendChild(star);

}


/* ==================================================
   FIREWORK FUNCTION
================================================== */

function createFirework(x, y) {

    const colors = [

        "#ff4f91",
        "#ffd43b",
        "#5ce1ff",
        "#9b5cff",
        "#6cff8d",
        "#ffffff"

    ];


    const color =
        colors[
            Math.floor(
                Math.random() *
                colors.length
            )
        ];


    /* Create 60 particles */

    for (
        let i = 0;
        i < 60;
        i++
    ) {

        const particle =
            document.createElement("div");


        particle.className =
            "particle";


        particle.style.left =
            x + "px";


        particle.style.top =
            y + "px";


        particle.style.background =
            color;


        /* Random direction */

        const angle =
            Math.random() *
            Math.PI *
            2;


        const distance =
            70 +
            Math.random() *
            160;


        const dx =
            Math.cos(angle) *
            distance;


        const dy =
            Math.sin(angle) *
            distance;


        particle.style.setProperty(
            "--x",
            dx + "px"
        );


        particle.style.setProperty(
            "--y",
            dy + "px"
        );


        document.body.appendChild(
            particle
        );


        setTimeout(
            () => {
                particle.remove();
            },
            1600
        );

    }

}


/* ==================================================
   RANDOM FIREWORK
================================================== */

function randomFirework() {

    const x =
        Math.random() *
        window.innerWidth;


    const y =
        100 +
        Math.random() *
        (window.innerHeight * 0.45);


    createFirework(x, y);

}


/* ==================================================
   START BIRTHDAY
================================================== */

function startBirthday() {


    /* Get elements */

    const music =
        document.getElementById(
            "birthdayMusic"
        );


    const button =
        document.querySelector(
            "button"
        );


    const cake =
        document.getElementById(
            "cake"
        );


    /* Hide button */

    button.style.display =
        "none";


    /* Make cake slightly fade */

    cake.classList.add(
        "hideCake"
    );


    /* ==================================================
       START MUSIC
    ================================================== */

    music.currentTime = 0;

    music.volume = 0.8;

    music.play().catch(
        function(error) {

            console.log(
                "Music could not start:",
                error
            );

        }
    );


    /* ==================================================
       FIREWORK SHOW
    ================================================== */


    /* First fireworks */

    setTimeout(
        () => {

            createFirework(
                window.innerWidth * 0.20,
                window.innerHeight * 0.30
            );

        },
        200
    );


    setTimeout(
        () => {

            createFirework(
                window.innerWidth * 0.80,
                window.innerHeight * 0.30
            );

        },
        600
    );


    setTimeout(
        () => {

            createFirework(
                window.innerWidth * 0.50,
                window.innerHeight * 0.25
            );

        },
        1000
    );


    setTimeout(
        () => {

            createFirework(
                window.innerWidth * 0.15,
                window.innerHeight * 0.45
            );


            createFirework(
                window.innerWidth * 0.85,
                window.innerHeight * 0.45
            );

        },
        1400
    );


    /* More fireworks */

    setTimeout(
        () => {

            createFirework(
                window.innerWidth * 0.35,
                window.innerHeight * 0.20
            );


            createFirework(
                window.innerWidth * 0.65,
                window.innerHeight * 0.20
            );

        },
        1800
    );


    /* ==================================================
       SHOW HAPPY BIRTHDAY
    ================================================== */

    setTimeout(
        () => {

            document
                .getElementById(
                    "birthday"
                )
                .classList.add(
                    "show"
                );


            document
                .getElementById(
                    "message"
                )
                .classList.add(
                    "show"
                );


        },
        2700
    );


    /* ==================================================
       FINAL FIREWORKS
    ================================================== */

    setTimeout(
        () => {

            createFirework(
                window.innerWidth * 0.10,
                window.innerHeight * 0.25
            );


            createFirework(
                window.innerWidth * 0.90,
                window.innerHeight * 0.25
            );


            createFirework(
                window.innerWidth * 0.50,
                window.innerHeight * 0.18
            );

        },
        3200
    );

}

</script>

</body>
</html>
